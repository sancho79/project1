<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토스 프로젝트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body>
  <!-- 헤더 네비게이션 -->
  <header>
    <nav>
      <ul class="gnb">
        <li>홈</li>
        <li>서비스</li>
        <li>혜택</li>
        <li>고객센터</li>
        <li>내정보</li>
      </ul>
    </nav>
  </header>

  <!-- 메인 배너 -->
  <section class="main-banner">
    <div class="main-text">
      <h1>토스와 함께하는<br>새로운 금융 생활</h1>
      <p>간편하고 안전하게, 토스에서 시작하세요.</p>
      <button>시작하기</button>
    </div>
    <div class="main-image"></div>
  </section>

  <!-- 주요 서비스 카드 -->
  <section class="service-cards">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </section>

  <!-- 프로모션/이벤트 배너 -->
  <section class="promotion-banner"></section>

  <!-- 추천 서비스 -->
  <section class="recommend">
    <div class="recommend-card"></div>
    <div class="recommend-card"></div>
    <div class="recommend-card"></div>
  </section>

  <!-- 하단 배너 -->
  <section class="bottom-banner"></section>

  <!-- 푸터 -->
  <footer>
    <div class="footer-menu">
      <span>회사소개</span>
      <span>이용약관</span>
      <span>개인정보처리방침</span>
      <span>고객센터</span>
    </div>
    <div class="footer-copy">© 2025 Toss Corp.</div>
  </footer>
</body>
</html>
