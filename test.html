<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토스 프로젝트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.8/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
  <link rel="stylesheet" href="css/test.css">
</head>
<style>
  .service-card {
  background: #fff;
  border-radius: 32px;
  padding: 0;
  width: 260px;
  box-shadow: 0 8px 32px 0 rgba(30, 32, 37, 0.10), 0 1.5px 4px 0 rgba(30,32,37,0.04);
  text-align: center;
  overflow: hidden;
  border: 1px solid #f0f2f5;
  transition: box-shadow 0.2s, transform 0.2s;
  position: relative;
}
.service-card:hover {
  box-shadow: 0 16px 48px 0 rgba(30, 32, 37, 0.16), 0 2px 8px 0 rgba(30,32,37,0.08);
  transform: translateY(-4px) scale(1.03);
}
.service-card img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: #f5f7fa;
  border-bottom: 1px solid #f0f2f5;
  margin-bottom: 0;
  display: block;
}
.service-card h3 {
  font-size: 1.15rem;
  font-weight: 700;
  margin: 24px 0 8px 0;
}
.service-card p {
  font-size: 1rem;
  color: #666;
  margin-bottom: 24px;
}
</style>
<body>
   <div class="popup">
        해당 사이트는 학습용으로 제작되었으며 toss와 무관합니다.
        구직용 포트폴리오로 상업적 목적이 없음을 알립니다.
        <button>닫기</button>
    </div>
  <!-- 헤더 네비게이션 -->
  <header>
    <nav>
      <ul class="gnb">
        <li>홈</li>
        <li>서비스</li>
        <li>혜택</li>
        <li>고객센터</li>
        <li>내정보</li>
      </ul>
    </nav>
  </header>

  <!-- 메인 배너 -->
  <section class="main-banner">
    <div class="main-text">
      <h1>토스와 함께하는<br>새로운 금융 생활</h1>
      <p>간편하고 안전하게, 토스에서 시작하세요.</p>
      <button>시작하기</button>
    </div>
    <div class="main-image"></div>
  </section>

  <!-- 주요 서비스 카드 -->
  <section class="service-cards">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </section>

  <!-- 프로모션/이벤트 배너 -->
  <section class="promotion-banner"></section>

  <!-- 추천 서비스 -->
  <section class="recommend">
    <div class="recommend-card"></div>
    <div class="recommend-card"></div>
    <div class="recommend-card"></div>
  </section>

  <!-- 하단 배너 -->
  <section class="bottom-banner"></section>

  <!-- 푸터 -->
  <footer>
    <div class="footer-menu">
      <span>회사소개</span>
      <span>이용약관</span>
      <span>개인정보처리방침</span>
      <span>고객센터</span>
    </div>
    <div class="footer-copy">© 2025 Toss Corp.</div>
  </footer>
  <script src="script/js.js"></script>
</body>
</html>
